name = "fotoro-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
[vars]
AUTH_MODE = "local"
[[d1_databases]]
binding = "DB"
database_name = "fotoro-local"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "migrations"
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fotoro-private-local"
[env.production.vars]
AUTH_MODE = "production"

# Build the web application locally first. No provider is provisioned here.
[env.production.assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
