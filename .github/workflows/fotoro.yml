name: Fotoro

on:
  pull_request:
    paths: [".github/workflows/fotoro.yml", "fotoro/**"]
  push:
    branches: ["main", "codex/ai-photos"]
    paths: [".github/workflows/fotoro.yml", "fotoro/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fotoro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOTORO_PUBLIC_MODEL_CACHE: ${{ runner.temp }}/fotoro-public-model-cache
    defaults:
      run:
        working-directory: fotoro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm install --global pnpm@10.17.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Cache public search model assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fotoro-public-model-cache
          key: fotoro-public-tinyclip-q8-${{ runner.os }}-transformers4-9463a9c508a344c837ffefe9d724f3827bf2dc79
      - run: pnpm test:search:visual
      - name: Public search relevance regression baseline
        run: pnpm test:search:relevance --require-baseline --output="${{ runner.temp }}/fotoro-public-search-relevance.json"
      - name: Preserve public search relevance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fotoro-public-search-relevance
          path: ${{ runner.temp }}/fotoro-public-search-relevance.json
          if-no-files-found: warn
          retention-days: 14

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm install --global pnpm@10.17.1
      - run: pnpm install --frozen-lockfile
        working-directory: fotoro
      - name: Native host regression tests
        working-directory: fotoro
        run: pnpm test:ios:host
      # A deliberate PR-only mode for work requested without device/Simulator
      # runtimes. Default PRs and every main push retain the runtime tests below.
      - name: Generic iOS SDK compilation (host-only PR)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'fotoro-host-only')
        working-directory: fotoro
        run: |
          xcodebuild build -project apps/ios/Fotoro.xcodeproj -scheme Fotoro -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath apps/ios/build-sdk CODE_SIGNING_ALLOWED=NO
          xcodebuild build -project apps/ios/Fotoro.xcodeproj -scheme FotoroLocalPreview -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath apps/ios/build-sdk CODE_SIGNING_ALLOWED=NO
          echo 'Host-only qualification: policy tests and SDK compilation passed; iPhone/Simulator runtime tests were not run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Native tests against public local services
        if: ${{ !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'fotoro-host-only')) }}
        working-directory: fotoro
        run: |
          pnpm seed:local
          pnpm --filter @fotoro/api dev:native-test > /tmp/fotoro-api.log 2>&1 &
          api_pid=$!
          pnpm dev:fixtures > /tmp/fotoro-fixtures.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$api_pid" "$fixture_pid" 2>/dev/null || true' EXIT
          services_ready=false
          for attempt in {1..100}; do
            if [[ "$(curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8787/v1/vault)" == "401" ]] && curl --silent --fail --max-time 2 http://127.0.0.1:8790/__fixtures/accounts >/dev/null; then
              services_ready=true
              break
            fi
            sleep 0.2
          done
          if [[ "$services_ready" != true ]]; then
            echo "Public local services did not become ready"
            exit 1
          fi
          pnpm exec tsx tools/warm-local-api.ts
          pnpm test:ios
      - name: Local Photos preview tests
        if: ${{ !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'fotoro-host-only')) }}
        working-directory: fotoro
        run: node tools/test-ios.mjs --local-preview
      - name: Local service diagnostics on failure
        if: failure()
        run: |
          tail -n 120 /tmp/fotoro-api.log || true
          tail -n 80 /tmp/fotoro-fixtures.log || true
